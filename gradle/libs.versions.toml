navigation = "2.8.5"
hilt = "2.52"
room = "2.6.1"
datastore = "1.1.1"
work = "2.10.0"
biometric = "1.1.0"
vico = "2.0.0-alpha.28"
junit = "4.13.2"
junit5 = "5.11.3"
coroutines = "1.9.0"
serialization = "1.7.3"
